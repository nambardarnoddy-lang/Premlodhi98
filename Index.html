<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Stylesheet'); ?>
  </head>
  <body>
    <div class="container">
      <h1>Document Upload</h1>

      <form id="uploadForm">
        <label class="file-picker" for="fileInput">
          <span>Select files</span>
          <input id="fileInput" type="file" multiple />
        </label>

        <button type="submit">Upload</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>

      <div class="results">
        <h2>Uploaded Files</h2>
        <ul id="uploadedFiles"></ul>
      </div>
    </div>

    <script>
      const form = document.getElementById('uploadForm');
      const fileInput = document.getElementById('fileInput');
      const statusBox = document.getElementById('status');
      const uploadedFiles = document.getElementById('uploadedFiles');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const files = [...fileInput.files];
        if (!files.length) {
          setStatus('Please select at least one file.', true);
          return;
        }

        setStatus('Uploading files...');
        uploadedFiles.innerHTML = '';

        try {
          const results = [];

          for (const file of files) {
            const base64Data = await readFileAsBase64(file);
            const result = await new Promise((resolve, reject) => {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .uploadDocument(
                  file.name,
                  base64Data,
                  file.type || 'application/octet-stream'
                );
            });

            results.push(result);
          }

          renderUploadedFiles(results);
          setStatus(`${results.length} file(s) uploaded successfully.`);
          form.reset();
        } catch (error) {
          console.error(error);
          setStatus('Upload failed. Please try again.', true);
        }
      });

      function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = () => reject(new Error('Unable to read file.'));
          reader.readAsDataURL(file);
        });
      }

      function renderUploadedFiles(results) {
        if (!results.length) {
          uploadedFiles.innerHTML = '<li>No files uploaded yet.</li>';
          return;
        }

        uploadedFiles.innerHTML = results
          .map(
            (file) => `
              <li>
                <a href="${file.url}" target="_blank" rel="noopener noreferrer">${file.name}</a>
                <span>(${formatBytes(file.size)})</span>
              </li>
            `
          )
          .join('');
      }

      function formatBytes(bytes) {
        if (!bytes) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const value = bytes / Math.pow(1024, index);
        return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
      }

      function setStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle('error', isError);
      }
    </script>
  </body>
</html>
